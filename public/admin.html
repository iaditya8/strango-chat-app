<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - Voice Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container {
      max-width: 900px;
      margin: 2rem auto;
    }
    .admin-card {
      background: rgba(15, 23, 42, 0.96);
      border-radius: 1.25rem;
      padding: 1.5rem;
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.85);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .admin-title {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .admin-sub {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .stat-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .stat-pill {
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(55, 65, 81, 0.9);
      color: #e5e7eb;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
    th, td {
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid rgba(31, 41, 55, 1);
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: rgba(15, 23, 42, 1);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.7);
    }
    .status-chip {
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 1);
      font-size: 0.75rem;
    }
    .status-paired {
      border-color: rgba(34, 197, 94, 0.7);
      color: #bbf7d0;
      background: rgba(22, 163, 74, 0.14);
    }
    .status-alone {
      border-color: rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      background: rgba(15, 23, 42, 0.7);
    }
    .refresh-info {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.5rem;
    }
    .refresh-btn {
      border-radius: 999px;
      border: none;
      padding: 0.35rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
      background: rgba(79, 70, 229, 1);
      color: white;
    }
  </style>
</head>
<body>
  <div class="app admin-container">
    <div class="admin-card">
      <div class="admin-header">
        <div>
          <div class="admin-title">Admin Dashboard</div>
          <div class="admin-sub">Live view of online users and active calls.</div>
        </div>
        <button id="refreshBtn" class="refresh-btn">Refresh</button>
      </div>

      <div class="stat-row">
        <div class="stat-pill" id="totalOnline">Online: 0</div>
        <div class="stat-pill" id="activeCalls">Active calls: 0</div>
      </div>

      <div style="max-height: 350px; overflow: auto; border-radius: 0.75rem;">
        <table>
          <thead>
            <tr>
              <th>Socket ID</th>
              <th>Name</th>
              <th>Country</th>
              <th>Gender</th>
              <th>Status</th>
              <th>Partner</th>
              <th>Online (s)</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>

      <p class="refresh-info" id="refreshInfo">Refreshing every 5 seconds…</p>
    </div>
  </div>

  <script>
    const refreshBtn = document.getElementById('refreshBtn');
    const usersBody = document.getElementById('usersBody');
    const totalOnlineEl = document.getElementById('totalOnline');
    const activeCallsEl = document.getElementById('activeCalls');
    const refreshInfoEl = document.getElementById('refreshInfo');

    async function loadUsers() {
      try {
        const res = await fetch('/admin/users');
        const data = await res.json();

        totalOnlineEl.textContent = 'Online: ' + data.totalOnline;
        activeCallsEl.textContent = 'Active calls: ' + data.activeCalls;

        usersBody.innerHTML = '';

        data.users.forEach(u => {
          const tr = document.createElement('tr');

          const status = u.partner ? 'Paired' : 'Waiting/Idle';
          const statusClass = u.partner ? 'status-chip status-paired' : 'status-chip status-alone';

          tr.innerHTML = `
            <td>${u.id.slice(0, 8)}...</td>
            <td>${u.name}</td>
            <td>${u.country}</td>
            <td>${u.gender}</td>
            <td><span class="${statusClass}">${status}</span></td>
            <td>${u.partner ? u.partner.slice(0, 8) + '...' : '-'}</td>
            <td>${u.connectedForSeconds}</td>
          `;

          usersBody.appendChild(tr);
        });

        const now = new Date().toLocaleTimeString();
        refreshInfoEl.textContent = 'Last updated at ' + now + '. Refreshes every 5 seconds.';
      } catch (err) {
        console.error('Error loading admin data:', err);
        refreshInfoEl.textContent = 'Error loading data. Check console.';
      }
    }

    refreshBtn.onclick = loadUsers;

    // auto refresh every 5 seconds
    loadUsers();
    setInterval(loadUsers, 5000);
  </script>
</body>
</html>
